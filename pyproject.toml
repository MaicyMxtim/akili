[project]
name = "akili"
version = "0.1.0"
description = "Akili Platform: an end-to-end MLOps platform on a virtual multi-node cluster"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[dependency-groups]
dev = [
    "cryptography>=49.0.0",
    "dvc[s3]>=3.67.1",
]
