apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      valuesObject:
        # admission-only: background scans, reports and cleanup cost memory
        # this cluster does not have to spare
        backgroundController:
          enabled: false
        reportsController:
          enabled: false
        cleanupController:
          enabled: false
        admissionController:
          replicas: 1
          container:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # 384Mi OOMKilled under signature-verification load; a
                # fail-closed webhook that dies takes the cluster with it
                memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
