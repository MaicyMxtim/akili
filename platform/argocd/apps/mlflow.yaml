apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    # 1.11.2 ships MLflow 3.14, which leaks server processes until the pod
    # OOMs (reproduced outside k8s). 1.8.1 ships the older stable 3.7.
    targetRevision: 1.8.1
    helm:
      valuesObject:
        postgresql:
          enabled: true
          auth:
            username: mlflow
            database: mlflow
            # password comes from a secret created outside git, alongside
            # the other bootstrap secrets (see README)
            existingSecret: mlflow-postgres-auth
          primary:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
        # the chart wires the connection to its bundled postgres itself;
        # setting backendStore.postgres as well is rejected by its schema
        backendStore:
          databaseMigration: true
          databaseConnectionCheck: true
        artifactRoot:
          s3:
            enabled: true
            bucket: akili-mlflow
            existingSecret:
              name: minio-creds
              keyOfAccessKeyId: rootUser
              keyOfSecretAccessKey: rootPassword
        # 4 default workers OOM a 1Gi pod; 2 is plenty for this cluster
        extraArgs:
          workers: "1"
        extraEnvVars:
          MLFLOW_S3_ENDPOINT_URL: http://minio.minio.svc:9000
          # security middleware rejects the in-cluster service hostname
          # otherwise ("possible DNS rebinding attack"); verified locally
          MLFLOW_SERVER_ALLOWED_HOSTS: "*"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
