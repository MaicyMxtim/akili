apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 1.11.2
    helm:
      valuesObject:
        # password in git is a known tradeoff while the repo is private;
        # Phase 10 replaces this with proper secret management
        postgresql:
          enabled: true
          auth:
            username: mlflow
            password: REDACTED-ROTATED-CREDENTIAL
            database: mlflow
          primary:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
        backendStore:
          databaseMigration: true
          databaseConnectionCheck: true
          postgres:
            enabled: true
            host: mlflow-postgresql
            port: 5432
            database: mlflow
            user: mlflow
            password: REDACTED-ROTATED-CREDENTIAL
        artifactRoot:
          s3:
            enabled: true
            bucket: akili-mlflow
            existingSecret:
              name: minio-creds
              keyOfAccessKeyId: rootUser
              keyOfSecretAccessKey: rootPassword
        extraEnvVars:
          MLFLOW_S3_ENDPOINT_URL: http://minio.minio.svc:9000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
