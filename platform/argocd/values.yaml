# Trimmed Argo CD install: no SSO, no notifications, no ApplicationSets,
# plain http server (access is via port-forward only)
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
configs:
  params:
    server.insecure: true
# 512Mi was OOMKilling the controller once monitoring's CRDs arrived
controller:
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1536Mi
server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
