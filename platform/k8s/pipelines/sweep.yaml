# Three parallel training runs. Explicit steps instead of withItems: Argo
# v4.0.8 rejects {{item.key}} in steps (fails to resolve at validation).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sweep-price-model
  namespace: argo
spec:
  serviceAccountName: argo-workflow
  entrypoint: sweep
  templates:
    - name: sweep
      steps:
        - - name: small
            templateRef:
              name: train-price-model
              template: train
            arguments:
              parameters:
                - name: train-data
                  value: s3://akili-data/raw/pp/2025-12/pp.parquet
                - name: test-data
                  value: s3://akili-data/raw/pp/2026-06/pp.parquet
                - name: n-estimators
                  value: "300"
                - name: learning-rate
                  value: "0.05"
                - name: num-leaves
                  value: "31"
          - name: medium
            templateRef:
              name: train-price-model
              template: train
            arguments:
              parameters:
                - name: train-data
                  value: s3://akili-data/raw/pp/2025-12/pp.parquet
                - name: test-data
                  value: s3://akili-data/raw/pp/2026-06/pp.parquet
                - name: n-estimators
                  value: "500"
                - name: learning-rate
                  value: "0.05"
                - name: num-leaves
                  value: "63"
          - name: large
            templateRef:
              name: train-price-model
              template: train
            arguments:
              parameters:
                - name: train-data
                  value: s3://akili-data/raw/pp/2025-12/pp.parquet
                - name: test-data
                  value: s3://akili-data/raw/pp/2026-06/pp.parquet
                - name: n-estimators
                  value: "800"
                - name: learning-rate
                  value: "0.03"
                - name: num-leaves
                  value: "127"
