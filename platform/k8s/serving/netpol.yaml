# akili-prod is default-deny; open exactly what serving needs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: serve-egress
  namespace: akili-prod
spec:
  podSelector:
    matchLabels:
      app: serve
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mlflow
      ports:
        - port: 5000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
      ports:
        - port: 9000
          protocol: TCP
