apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: serve-error-rate
  namespace: akili-prod
spec:
  metrics:
    - name: error-rate
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] < 0.05
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          # both sides guarded: an error-free service must yield 0, not an
          # empty vector (empty crashes the success condition)
          query: |
            (sum(rate(http_requests_total{namespace="akili-prod",status=~"5.."}[2m])) or vector(0))
            /
            (sum(rate(http_requests_total{namespace="akili-prod"}[2m])) or vector(1))
