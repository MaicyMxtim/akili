apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: serve
  namespace: akili-prod
  labels:
    app: serve
spec:
  replicas: 2
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true
  strategy:
    canary:
      # 2 replicas: first step replaces one pod, analysis judges it on
      # live error rate, then the second follows
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: serve-error-rate
        - setWeight: 100
  selector:
    matchLabels:
      app: serve
  template:
    metadata:
      labels:
        app: serve
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: akili-serve:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.minio.svc:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootPassword
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: serve
  namespace: akili-prod
  labels:
    app: serve
spec:
  selector:
    app: serve
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: serve
  namespace: akili-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: serve
