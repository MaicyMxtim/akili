project: akili
provider: local
registry: /tmp/feast/registry.db
online_store:
  type: redis
  # feast does not expand env vars in this file, so the cluster DNS name is
  # written directly. Local runs override with FEAST_REPO_CONNECTION.
  connection_string: redis.akili-prod.svc:6379
offline_store:
  type: file
entity_key_serialization_version: 3
